<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b84ff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="./manifest.json">
<title>我的记账｜完整版</title>
<style>
*{box-sizing:border-box}
:root{--blue:#0b84ff;--bg:#f4f6f8;--text:#17212b;--muted:#7b8794;--card:#fff;--line:#e5e9ee;--danger:#d33b3b;--soft:#eef5fb}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",Arial,sans-serif;padding-bottom:88px}
button,input,select{font:inherit}
button{border:0;cursor:pointer}
.header{background:var(--blue);color:#fff;padding:48px 28px 38px;border-radius:0 0 42px 42px}
.header h1{margin:0 0 8px;font-size:42px;letter-spacing:-1px}.header p{margin:0;font-size:20px;opacity:.95}
.wrap{max-width:900px;margin:auto;padding:26px 18px}
.card{background:var(--card);border-radius:30px;padding:26px;margin-bottom:18px;box-shadow:0 7px 25px #17212b10}
h2{font-size:31px;margin:0 0 22px}h3{font-size:23px;margin:0 0 16px}
.big{font-size:52px;font-weight:800;margin:6px 0 24px}
.muted{color:var(--muted)}.small{font-size:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.stat{background:#f7f9fb;border-radius:24px;padding:18px}.stat b{display:block;font-size:25px;margin-top:6px}
.primary{background:var(--blue);color:#fff;border-radius:22px;padding:18px 24px;font-size:20px;font-weight:700}
.full{width:100%}.row{display:flex;gap:12px;align-items:center}.between{justify-content:space-between}
.input,.select{width:100%;border:1px solid #d8dee5;background:#fff;border-radius:18px;padding:15px 16px;outline:none}
.input:focus,.select:focus{border-color:var(--blue);box-shadow:0 0 0 3px #0b84ff18}
.filters{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.filters .wide{grid-column:1/-1}
.filter-actions{display:flex;gap:10px;margin-top:12px}.ghost{background:#edf2f6;color:#243444;border-radius:16px;padding:13px 17px}
.account{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:17px 0;border-bottom:1px solid var(--line)}
.account:last-child{border-bottom:0}.cat{font-weight:800;font-size:20px}.amount{font-size:22px;font-weight:800;white-space:nowrap}
.edit,.del{padding:13px 18px;border-radius:17px}.edit{background:#edf3f7;color:#30404f}.del{background:#ffe9e9;color:var(--danger)}
.empty{text-align:center;padding:30px;color:var(--muted)}
.bottom{position:fixed;z-index:20;left:0;right:0;bottom:0;height:82px;background:#fff;border-top:1px solid #dce1e5;display:flex;justify-content:center}
.bottom button{flex:1;max-width:300px;background:none;color:#7b8794;font-size:23px}.bottom button.active{color:var(--blue);font-weight:800}
.view{display:none}.view.active{display:block}
.bar{height:16px;background:#edf1f5;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--blue);border-radius:99px}
.chart{width:100%;height:280px;display:block;background:#fbfcfd;border-radius:22px}
.legend{display:flex;justify-content:space-between;padding:8px 4px;color:var(--muted);font-size:13px}
.rank{display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}
.rank:last-child{border:0}.ranknum{font-size:24px;font-weight:800;color:var(--blue)}
.modal{position:fixed;inset:0;background:#0007;z-index:40;display:none;align-items:flex-end;justify-content:center}
.modal.show{display:flex}.sheet{background:#fff;width:min(900px,100%);border-radius:30px 30px 0 0;padding:24px;max-height:92vh;overflow:auto}
.sheet h2{font-size:28px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.formgrid .wide{grid-column:1/-1}.actions{display:flex;gap:10px;margin-top:18px}.actions button{flex:1}
.notice{background:#eef7ff;border-radius:18px;padding:13px 15px;color:#1f6fbf;margin-bottom:15px}
.ratebox{background:#f4f8fb;border-radius:20px;padding:15px;margin-top:12px}.ratebox b{font-size:20px}.rate-status{font-size:13px;color:var(--muted);margin-top:5px}
.monthrow{display:flex;gap:10px;align-items:center}.monthrow .select{max-width:180px}
.nojs{padding:20px}
@media(max-width:650px){
 .header{padding:38px 22px 30px}.header h1{font-size:38px}.wrap{padding:18px 14px}.card{padding:21px;border-radius:25px}
 .grid3{gap:8px}.stat{padding:14px}.stat b{font-size:21px}.big{font-size:44px}
 .account{grid-template-columns:1fr auto}.account .edit,.account .del{grid-row:2}.amount{grid-column:2;grid-row:1}
 .filters,.formgrid{grid-template-columns:1fr}.filters .wide,.formgrid .wide{grid-column:auto}
}
</style>
</head>
<body>
<div id="app">
<header class="header"><h1>我的记账</h1><p>简单记录每天的每一笔支出</p></header>
<main class="wrap">

<section id="home" class="view active">
 <div class="card">
  <div class="muted">今天 <span id="today"></span></div>
  <div class="big" id="todayTotal">NT$ 0</div>
  <div class="grid3">
   <div class="stat"><span class="muted">7天</span><b id="weekTotal">NT$ 0</b></div>
   <div class="stat"><span class="muted">本月</span><b id="monthTotal">NT$ 0</b></div>
   <div class="stat"><span class="muted">笔数</span><b id="monthCount">0</b></div>
  </div>
 </div>
 <div class="card"><button class="primary full" onclick="openAdd()">＋ 记录一笔支出</button><div class="ratebox"><b>💱 即时汇率</b><div id="rateStatus" class="rate-status">正在读取即时汇率…</div></div></div>
 <div class="card">
  <div class="row between"><h2>今天的记录</h2><span class="notice" id="todayCount">0 笔</span></div>
  <div id="todayList"></div>
 </div>
</section>

<section id="accounts" class="view">
 <div class="card">
  <div class="row between"><h2>全部账目</h2><button class="primary" onclick="openAdd()">＋ 新增</button></div>
  <div class="filters">
   <input id="search" class="input wide" placeholder="搜索类别、备注或日期" oninput="renderAccounts()">
   <select id="filterCat" class="select" onchange="renderAccounts()"></select>
   <select id="sortBy" class="select" onchange="renderAccounts()">
    <option value="new">最新在前</option><option value="old">最早在前</option>
    <option value="high">金额由高到低</option><option value="low">金额由低到高</option>
   </select>
   <label>开始日期<input id="fromDate" type="date" class="input" onchange="renderAccounts()"></label>
   <label>结束日期<input id="toDate" type="date" class="input" onchange="renderAccounts()"></label>
   <input id="minAmount" type="number" min="0" class="input" placeholder="最低金额" oninput="renderAccounts()">
   <input id="maxAmount" type="number" min="0" class="input" placeholder="最高金额" oninput="renderAccounts()">
  </div>
  <div class="filter-actions"><button class="ghost" onclick="clearFilters()">清除筛选</button><span class="muted" id="resultCount" style="padding:12px 4px"></span></div>
 </div>
 <div class="card"><div id="accountList"></div></div>
</section>

<section id="stats" class="view">
 <div class="card">
  <div class="row between"><h2>详细统计</h2><div class="monthrow"><span class="muted">月份</span><select id="statMonth" class="select" onchange="renderStats()"></select></div></div>
  <div class="grid3">
   <div class="stat"><span class="muted">本月支出</span><b id="sTotal">NT$ 0</b></div>
   <div class="stat"><span class="muted">平均每日</span><b id="sAvg">NT$ 0</b></div>
   <div class="stat"><span class="muted">最大一笔</span><b id="sMax">NT$ 0</b></div>
  </div>
 </div>
 <div class="card"><h2>每日支出趋势</h2><canvas id="dailyChart" class="chart"></canvas><div class="legend"><span>1日</span><span>15日</span><span id="monthEnd">30日</span></div></div>
 <div class="card"><h2>类别统计</h2><div id="categoryStats"></div></div>
 <div class="card"><h2>类别金额排名</h2><div id="categoryRank"></div></div>
 <div class="card"><h2>本月明细</h2><div id="statRecords"></div></div>
</section>
</main>
<nav class="bottom"><button id="navHome" class="active" onclick="showView('home')">首页</button><button id="navAccounts" onclick="showView('accounts')">账目</button><button id="navStats" onclick="showView('stats')">统计</button></nav>
</div>

<div id="modal" class="modal">
 <div class="sheet">
  <div class="row between"><h2 id="modalTitle">新增支出</h2><button class="ghost" onclick="closeModal()">关闭</button></div>
  <div class="formgrid">
   <label>金额<input id="fAmount" class="input" type="number" min="0" step="0.01" inputmode="decimal" placeholder="例如 100" oninput="updateAmountPreview()"></label>
   <label>货币<select id="fCurrency" class="select" onchange="updateAmountPreview()"></select></label>
   <label>类别<select id="fCategory" class="select"></select></label>
   <label>日期<input id="fDate" class="input" type="date"></label>
   <label>时间<input id="fTime" class="input" type="time"></label>
   <label class="wide">备注<input id="fNote" class="input" placeholder="可填写店名、用途等"></label>
  </div>
  <div id="amountPreview" class="ratebox"><b>换算为 NT$ 0</b><div class="rate-status">正在读取即时汇率…</div></div>
  <div class="actions"><button class="ghost" onclick="closeModal()">取消</button><button class="primary" onclick="saveRecord()">保存</button></div>
 </div>
</div>

<script>
const CATEGORIES=["餐饮","交通","购物","生活","娱乐","医疗","其他"];
const CURRENCIES=[
 {code:"TWD",name:"新台币",symbol:"NT$",flag:"🇹🇼"},
 {code:"MYR",name:"马来西亚令吉",symbol:"RM",flag:"🇲🇾"},
 {code:"USD",name:"美元",symbol:"US$",flag:"🇺🇸"},
 {code:"JPY",name:"日圆",symbol:"¥",flag:"🇯🇵"},
 {code:"CNY",name:"人民币",symbol:"¥",flag:"🇨🇳"},
 {code:"HKD",name:"港币",symbol:"HK$",flag:"🇭🇰"},
 {code:"SGD",name:"新加坡元",symbol:"S$",flag:"🇸🇬"},
 {code:"KRW",name:"韩元",symbol:"₩",flag:"🇰🇷"},
 {code:"EUR",name:"欧元",symbol:"€",flag:"🇪🇺"},
 {code:"GBP",name:"英镑",symbol:"£",flag:"🇬🇧"},
 {code:"AUD",name:"澳元",symbol:"A$",flag:"🇦🇺"},
 {code:"CAD",name:"加元",symbol:"C$",flag:"🇨🇦"},
 {code:"THB",name:"泰铢",symbol:"฿",flag:"🇹🇭"},
 {code:"VND",name:"越南盾",symbol:"₫",flag:"🇻🇳"}
];
const STORAGE_KEY="my-ledger-data-v3";
const RATE_CACHE_KEY="my-ledger-rates-v1";
let records=[], editingId=null, rates={TWD:1}, rateDate="", ratesReady=false;

function currencyInfo(code){return CURRENCIES.find(c=>c.code===code)||CURRENCIES[0]}
function money(n,currency="TWD"){const c=currencyInfo(currency);return c.symbol+" "+Number(n||0).toLocaleString("zh-TW",{maximumFractionDigits:2})}
function toTWD(amount,currency){if(currency==="TWD")return Number(amount)||0;const r=Number(rates[currency]);return r>0?(Number(amount)||0)/r:null}
function pad(n){return String(n).padStart(2,"0")}
function dateKey(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function nowDate(){return dateKey(new Date())}
function parseDate(r){return new Date((r.date||"1970-01-01")+"T"+(r.time||"00:00"))}
function escapeHtml(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}

function normalize(x){
 if(!x||typeof x!=="object") return null;
 const amount=Number(x.amount??x.money??x.price??x.value);
 const date=String(x.date??x.day??x.createdAt??"").slice(0,10);
 if(!Number.isFinite(amount)||amount<0||!date.match(/^\d{4}-\d{2}-\d{2}$/)) return null;
 return {id:String(x.id??(Date.now()+Math.random())),amount, currency:String(x.currency??"TWD"),category:String(x.category??x.type??"其他"),note:String(x.note??x.remark??x.memo??""),date,time:String(x.time??"12:00").slice(0,5)};
}
function load(){
 try{
  const saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||"null");
  if(Array.isArray(saved)) records=saved.map(normalize).filter(Boolean);
 }catch(e){}
 if(!records.length){
  const candidates=["my-ledger-data-v2","my-ledger-expenses-v1","my-ledger","my-ledger-data","ledgerData","ledger","expenses","myLedger","records"];
  for(const k of candidates){
   try{const v=JSON.parse(localStorage.getItem(k)||"null");if(Array.isArray(v)){const n=v.map(normalize).filter(Boolean);if(n.length){records=n;break}}}catch(e){}
  }
 }
 records=records.filter(Boolean);
 save();
}
function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(records))}
async function loadRates(){
 ratesReady=false;
 try{
  const cached=JSON.parse(localStorage.getItem(RATE_CACHE_KEY)||"null");
  if(cached&&cached.rates){rates=cached.rates;rateDate=cached.date||"";}
 }catch(e){}
 try{
  const quotes=CURRENCIES.filter(c=>c.code!=="TWD").map(c=>c.code).join(",");
  const res=await fetch("https://api.frankfurter.dev/v2/rates?base=TWD&quotes="+encodeURIComponent(quotes),{cache:"no-store"});
  if(!res.ok)throw new Error("rate request failed");
  const data=await res.json();
  const next={TWD:1};
  (data.rates||[]).forEach(x=>{if(x.quote&&Number(x.rate)>0)next[x.quote]=Number(x.rate)});
  if(Object.keys(next).length>1){rates=next;rateDate=data.date||"";localStorage.setItem(RATE_CACHE_KEY,JSON.stringify({rates, date:rateDate, savedAt:Date.now()}));}
 }catch(e){}
 ratesReady=true;
 updateRateStatus();
 renderAll();
}
function updateRateStatus(){
 const el=document.getElementById("rateStatus");
 if(el){el.textContent=rateDate?("即时汇率已更新："+rateDate+(Object.keys(rates).length>1?" · 联网失败时会使用上次汇率":"")):"尚未取得联网汇率";}
 updateAmountPreview();
}
function updateAmountPreview(){
 const box=document.getElementById("amountPreview");if(!box)return;
 const amount=Number(document.getElementById("fAmount").value)||0;
 const currency=document.getElementById("fCurrency").value||"TWD";
 const converted=toTWD(amount,currency);
 const c=currencyInfo(currency);
 box.innerHTML=converted==null?`<b>${c.symbol} ${amount.toLocaleString("zh-TW")} ${currency}</b><div class="rate-status">目前无法取得 ${currency} → TWD 汇率，保存后仍会保留原货币金额。</div>`:`<b>${money(amount,currency)} ≈ NT$ ${converted.toLocaleString("zh-TW",{maximumFractionDigits:2})}</b><div class="rate-status">${currency==="TWD"?"本身就是新台币":"按当前可用汇率换算"}${rateDate?" · "+rateDate:""}</div>`;
}
function fillCurrencies(){
 const el=document.getElementById("fCurrency");
 if(el)el.innerHTML=CURRENCIES.map(c=>`<option value="${c.code}">${c.flag} ${c.code} · ${c.name} (${c.symbol})</option>`).join("");
}

function fillCategories(){
 const opts='<option value="全部">全部类别</option>'+CATEGORIES.map(c=>`<option value="${c}">${c}</option>`).join("");
 document.getElementById("filterCat").innerHTML=opts;
 document.getElementById("fCategory").innerHTML=CATEGORIES.map(c=>`<option>${c}</option>`).join("");
}
function showView(v){
 document.querySelectorAll(".view").forEach(x=>x.classList.remove("active"));
 document.getElementById(v).classList.add("active");
 document.querySelectorAll(".bottom button").forEach(x=>x.classList.remove("active"));
 document.getElementById("nav"+v.charAt(0).toUpperCase()+v.slice(1)).classList.add("active");
 if(v==="accounts")renderAccounts();
 if(v==="stats")renderStats();
 if(v==="home")renderHome();
 window.scrollTo({top:0,behavior:"smooth"});
}
function renderHome(){
 const today=nowDate(), d=new Date(), week=new Date();week.setDate(d.getDate()-6);
 const day=records.filter(r=>r.date===today), weekSum=records.filter(r=>parseDate(r)>=new Date(week.getFullYear(),week.getMonth(),week.getDate())).reduce((a,r)=>a+(toTWD(r.amount,r.currency||"TWD")??0),0);
 const month=records.filter(r=>r.date.slice(0,7)===today.slice(0,7));
 document.getElementById("today").textContent=today;
 document.getElementById("todayTotal").textContent=money(day.reduce((a,r)=>a+(toTWD(r.amount,r.currency||"TWD")??0),0));
 document.getElementById("weekTotal").textContent=money(weekSum);
 document.getElementById("monthTotal").textContent=money(month.reduce((a,r)=>a+(toTWD(r.amount,r.currency||"TWD")??0),0));
 document.getElementById("monthCount").textContent=month.length;
 document.getElementById("todayCount").textContent=day.length+" 笔";
 const box=document.getElementById("todayList");
 box.innerHTML=day.sort((a,b)=>parseDate(b)-parseDate(a)).map(rowHtml).join("")||'<div class="empty">今天还没有记录</div>';
}
function rowHtml(r){
 const cur=r.currency||"TWD", converted=toTWD(r.amount,cur); return `<div class="account"><div><div class="cat">${escapeHtml(r.category)}</div><div class="muted">${r.date} ${r.time}${r.note?` · ${escapeHtml(r.note)}`:""}</div></div><div class="amount">${money(r.amount,cur)}${cur!=="TWD"&&converted!=null?`<div class="muted small">≈ NT$ ${converted.toLocaleString("zh-TW",{maximumFractionDigits:2})}</div>`:""}</div><button class="edit" onclick="openEdit('${r.id}')">编辑</button><button class="del" onclick="removeRecord('${r.id}')">删</button></div>`;
}
function renderAccounts(){
 const q=(document.getElementById("search").value||"").trim().toLowerCase(), cat=document.getElementById("filterCat").value;
 const from=document.getElementById("fromDate").value,to=document.getElementById("toDate").value;
 const min=parseFloat(document.getElementById("minAmount").value),max=parseFloat(document.getElementById("maxAmount").value),sort=document.getElementById("sortBy").value;
 let a=records.filter(r=>{
  const text=(r.category+" "+r.note+" "+r.date+" "+r.time).toLowerCase();
  return (!q||text.includes(q))&&(!cat||cat==="全部"||r.category===cat)&&(!from||r.date>=from)&&(!to||r.date<=to)&&(!Number.isFinite(min)||r.amount>=min)&&(!Number.isFinite(max)||r.amount<=max)
 });
 a.sort((x,y)=>sort==="old"?parseDate(x)-parseDate(y):sort==="high"?y.amount-x.amount:sort==="low"?x.amount-y.amount:parseDate(y)-parseDate(x));
 document.getElementById("resultCount").textContent=a.length+" 笔";
 document.getElementById("accountList").innerHTML=a.map(rowHtml).join("")||'<div class="empty">没有符合条件的账目</div>';
}
function clearFilters(){
 ["search","fromDate","toDate","minAmount","maxAmount"].forEach(id=>document.getElementById(id).value="");
 document.getElementById("filterCat").value="全部";document.getElementById("sortBy").value="new";renderAccounts();
}
function openAdd(){
 editingId=null;document.getElementById("modalTitle").textContent="新增支出";
 document.getElementById("fAmount").value="";document.getElementById("fCurrency").value="TWD";document.getElementById("fCategory").value="餐饮";document.getElementById("fDate").value=nowDate();
 const d=new Date();document.getElementById("fTime").value=pad(d.getHours())+":"+pad(d.getMinutes());document.getElementById("fNote").value="";
 document.getElementById("modal").classList.add("show");
}
function openEdit(id){
 const r=records.find(x=>x.id===id);if(!r)return;editingId=id;
 document.getElementById("modalTitle").textContent="编辑支出";document.getElementById("fAmount").value=r.amount;document.getElementById("fCurrency").value=CURRENCIES.some(c=>c.code===(r.currency||"TWD"))?(r.currency||"TWD"):"TWD";document.getElementById("fCategory").value=CATEGORIES.includes(r.category)?r.category:"其他";
 document.getElementById("fDate").value=r.date;document.getElementById("fTime").value=r.time;document.getElementById("fNote").value=r.note;document.getElementById("modal").classList.add("show");
}
function closeModal(){document.getElementById("modal").classList.remove("show")}
function saveRecord(){
 const amount=Number(document.getElementById("fAmount").value),date=document.getElementById("fDate").value;
 if(!Number.isFinite(amount)||amount<0||!date){alert("请填写正确的金额和日期");return}
 const data={amount,currency:document.getElementById("fCurrency").value||"TWD",category:document.getElementById("fCategory").value,date,time:document.getElementById("fTime").value||"12:00",note:document.getElementById("fNote").value.trim()};
 if(editingId){const i=records.findIndex(r=>r.id===editingId);if(i>=0)records[i]={...records[i],...data}}
 else records.push({id:String(Date.now()+Math.random()),...data});
 save();closeModal();renderAll();
}
function removeRecord(id){
 const r=records.find(x=>x.id===id);if(!r)return;
 if(confirm(`确定删除 ${r.category} ${money(r.amount)} 吗？`)){records=records.filter(x=>x.id!==id);save();renderAll()}
}
function monthOptions(){
 const set=new Set(records.map(r=>r.date.slice(0,7)));set.add(nowDate().slice(0,7));
 const a=[...set].sort().reverse(),sel=document.getElementById("statMonth"),old=sel.value||nowDate().slice(0,7);
 sel.innerHTML=a.map(m=>`<option value="${m}">${m}</option>`).join("");sel.value=a.includes(old)?old:a[0];
}
function renderStats(){
 monthOptions();const m=document.getElementById("statMonth").value||nowDate().slice(0,7), a=records.filter(r=>r.date.slice(0,7)===m);
 const total=a.reduce((s,r)=>s+(toTWD(r.amount,r.currency||"TWD")??0),0),days=[...new Set(a.map(r=>r.date))].length,avg=days?total/days:0,max=a.reduce((z,r)=>Math.max(z,toTWD(r.amount,r.currency||"TWD")??0),0);
 document.getElementById("sTotal").textContent=money(total);document.getElementById("sAvg").textContent=money(avg);document.getElementById("sMax").textContent=money(max);
 const daysInMonth=new Date(Number(m.slice(0,4)),Number(m.slice(5,7)),0).getDate();document.getElementById("monthEnd").textContent=daysInMonth+"日";

function drawChart(data){
 const c=document.getElementById("dailyChart"),ctx=c.getContext("2d"),dpr=window.devicePixelRatio||1,w=c.clientWidth,h=280;
 c.width=w*dpr;c.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);
 const padL=42,padR=16,padT=22,padB=30,max=Math.max(...data,1),base=h-padB;
 ctx.strokeStyle="#e3e8ed";ctx.lineWidth=1;ctx.font="12px sans-serif";ctx.fillStyle="#7b8794";
 for(let i=0;i<4;i++){const y=padT+(base-padT)*i/3;ctx.beginPath();ctx.moveTo(padL,y);ctx.lineTo(w-padR,y);ctx.stroke();ctx.fillText(Math.round(max*(3-i)/3).toLocaleString(),4,y+4)}
 const pts=data.map((v,i)=>[padL+(w-padL-padR)*(data.length===1?0:i/(data.length-1)),base-(base-padT)*v/max]);
 ctx.strokeStyle="#0b84ff";ctx.lineWidth=3;ctx.lineJoin="round";ctx.lineCap="round";ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.stroke();
 ctx.fillStyle="#0b84ff";pts.forEach(p=>{ctx.beginPath();ctx.arc(p[0],p[1],3.5,0,Math.PI*2);ctx.fill()});
}
